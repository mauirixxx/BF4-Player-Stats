# BF4PS manual API: PRIVATE smoke-test configuration only.
# Include within the BF4PS TLS VirtualHost, AFTER the existing /bf4ps-api/ rules.
# Deliberately NO ProxyPass to port 8789: the private service must not be
# reachable from the Internet until a separately reviewed public gateway
# provides genuine client-IP throttling and CSRF/origin protection.
<LocationMatch "^/bf4ps-manual(?:/|$)">
    Require all denied
    Header always set Cache-Control "no-store"
</LocationMatch>
