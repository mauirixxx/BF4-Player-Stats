[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bf4-player-stats"
version = "0.1.0"
description = "Battlefield 4 player statistics collection and presentation service"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["bf4ps*"]
exclude = ["migrations*", "tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
