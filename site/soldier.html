function formatStat(s,key,type){if(type==='duration')return s[key]==null?'—':Math.floor(s[key]/3600).toLocaleString()+'h '+Math.floor(s[key]%3600/60)+'m';if(type==='percent')return s[key]==null?'—':Number(s[key]).toFixed(2)+'%';if(type==='ratio')return s.deaths==null||s.kills==null?'—':(s.kills/Math.max(1,s.deaths)).toFixed(2);if(type==='accuracy')return s.shots_fired==null||s.shots_hit==null?'—':(100*s.shots_hit/Math.max(1,s.shots_fired)).toFixed(2)+'%';return fmt(s[key])}
function leaderUrl(metric,item,soldier){const u=new URL('/index.html',location.origin);u.searchParams.set('metric',metric);if(item!=null)u.searchParams.set('item',item);u.searchParams.set('platform',soldier.platform);u.searchParams.set('soldier',soldier.persona_id);u.hash='leaderboards';return u.pathname+u.search+u.hash}
function equipment(rows,target,kind,soldier){const unique=new Map();for(const x of rows){const name=displayName(x.name);if(!unique.has(name)||Number(x.kills)>Number(unique.get(name).kills))unique.set(name,x)}const list=[...unique.values()].sort((a,b)=>Number(b.kills)-Number(a.kills)).slice(0,10);$(target).innerHTML=list.length?list.map(x=>'<li><a href="'+leaderUrl(kind,x.equipment_id,soldier)+'">'+safe(displayName(x.name))+' ↗</a><strong>'+fmt(x.kills)+'</strong></li>').join(''):'<li class="muted">Not collected yet</li>'}
async function main(){const id=Number(new URLSearchParams(location.search).get('id'));if(!Number.isSafeInteger(id)||id<=0)throw Error('Invalid soldier ID');const r=await fetch('/temp-stats-data.json',{cache:'no-store',signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('Statistics temporarily unavailable');const data=await r.json();const s=data.soldiers.find(x=>Number(x.soldier_id)===id);if(!s)throw Error('Soldier not found in collected snapshot');$('name').textContent=s.current_name;fetch('/bf4ps-api/aliases?soldier_id='+encodeURIComponent(id),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Aliases unavailable');return r.json()}).then(v=>{const rows=v.rows||[];if(!rows.length)return;const panel=$('aliases'),list=$('aliasList'),toggle=$('aliasToggle');panel.style.display='';$('aliasCount').textContent='('+rows.length+')';let expanded=false;function paint(){const shown=expanded?rows:rows.slice(0,8);list.replaceChildren(...shown.map(x=>{const span=document.createElement('span');span.textContent=x.name+(x.name===s.current_name?' (current)':'');span.title='First seen: '+x.first_seen_at+' | Last seen: '+x.last_seen_at;span.style.cssText='background:#243546;border:1px solid #4a5e70;border-radius:5px;padding:4px 8px;font-size:12px';return span}));toggle.style.display=rows.length>8?'':'none';toggle.textContent=expanded?'Show fewer aliases':'Show all '+rows.length+' aliases'}toggle.onclick=()=>{expanded=!expanded;paint()};paint()}).catch(e=>console.warn(e));const cc=String(s.country_code||'').trim().toLowerCase();const valid=/^[a-z]{2}$/.test(cc);const flagEl=document.createElement('img');flagEl.src=valid?'/assets/flags/'+cc+'.svg':'';if(!valid)flagEl.style.visibility='hidden';flagEl.alt=s.country_name||'Country not set';flagEl.style.cssText='width:37px;height:25px;object-fit:cover;vertical-align:3px;margin-right:10px;border:1px solid #657180';flagEl.onerror=()=>{flagEl.onerror=null;flagEl.style.visibility='hidden'};$('name').prepend(flagEl);document.title=s.current_name+' — BF4 Player Stats';const identity=$('identity');identity.textContent=(labels[s.platform]||s.platform)+' · Persona '+s.persona_id+' · '+(s.battlelog_username||'Battlelog account pending');const timestamps=[['Detailed stats',s.detailed_last_success_at],['Weapons',s.weapons_last_success_at],['Vehicles',s.vehicles_last_success_at],['Profile',s.profile_last_success_at]];const complete=timestamps.every(x=>Boolean(x[1]));const completedAt=complete?new Date(Math.max(...timestamps.map(x=>Date.parse(x[1])))):null;const collected=document.createElement('div');collected.className='muted';collected.style.marginTop='12px';collected.textContent=completedAt&&Number.isFinite(completedAt.getTime())?'Full collection last completed: '+completedAt.toLocaleString():'Full collection not yet completed';identity.after(collected);const actions=document.createElement('div');actions.className='profile-actions';const pid=String(s.persona_id);if(/^\d+$/.test(pid)){const links=[];if(['pc','ps4','xboxone'].includes(s.platform)){links.push(['Battlelog','https://battlelog.battlefield.com/bf4/soldier/'+encodeURIComponent(s.current_name)+'/stats/'+pid+'/'+s.platform+'/'])}if(s.platform==='pc'){links.push(['BF4DB','https://bf4db.com/player/'+pid],['Battlefield Agency','https://battlefield.agency/player/by-persona_id/bf4/'+pid],['BF4 Cheat Report','https://bf4cheatreport.com/?pid='+pid+'&uid=&cnt=200'])}for(const [label,url] of links){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=label+' ↗';actions.appendChild(a)}}const refresh=document.createElement('button');refresh.type='button';refresh.textContent='↻ Refresh Stats';actions.appendChild(refresh);const hint=document.createElement('span');hint.className='hint';hint.textContent='Manual refresh available';actions.appendChild(hint);refresh.addEventListener('click',async()=>{refresh.disabled=true;hint.textContent='Requesting refresh…';try{const t=await fetch('/manual-gateway.php',{credentials:'same-origin',cache:'no-store'});if(!t.ok)throw Error('Security token unavailable');const {csrf}=await t.json();const platform=String(s.platform||'').toLowerCase();const persona=String(s.persona_id||'');const url='https://battlelog.battlefield.com/bf4/soldier/'+encodeURIComponent(s.current_name||'soldier')+'/stats/'+persona+'/'+platform+'/';const r=await fetch('/manual-gateway.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-BF4PS-CSRF':csrf},body:JSON.stringify({url,kind:'refresh'})});const v=await r.json();if(!r.ok)throw Error(v.error||v.state||'Request failed');hint.textContent=({accepted:'Refresh prioritized',cooldown:'Recently refreshed',up_to_date:'Already current'})[v.state]||v.state||'Submitted';}catch(e){hint.textContent=e.message||'Request failed';}finally{refresh.disabled=false;}});collected.after(actions);
groups['Multiplayer score']=groups['Class & squad scores'];
groups['Team']=groups['Teamwork & objectives'].filter(x=>['repairs','revives','heals','resupplies'].includes(x[0])).concat(groups['Combat'].filter(x=>['avenger_kills','savior_kills','suppression_assists'].includes(x[0]))).concat(groups['Overview'].filter(x=>x[0]==='quit_percentage'));
groups['General']=groups['Overview'].filter(x=>['kills','deaths','wins','losses'].includes(x[0])).concat(groups['Combat'].filter(x=>['kill_assists','shots_fired','shots_hit'].includes(x[0]))).concat([['kd','K/D ratio','ratio'],['accuracy','Accuracy','accuracy']]);
groups['Extra']=groups['Combat'].filter(x=>['dogtags_taken','headshots','longest_headshot','highest_kill_streak','nemesis_kills','highest_nemesis_streak'].includes(x[0])).concat(groups['Teamwork & objectives'].filter(x=>['vehicles_destroyed','vehicle_damage'].includes(x[0])));
groups['Objectives']=groups['Teamwork & objectives'].filter(x=>['flags_captured','flags_defended'].includes(x[0]));
const columns=[['Multiplayer score','Team'],['General','Extra'],['Game mode scores','Objectives']];
for(let i=0;i<3;i++){
 const titles=columns[i];
 $(['statsA','statsB','statsC'][i]).innerHTML=titles.map(title=>'<section class="panel" style="margin-bottom:12px"><h2>'+safe(title)+'</h2><div class="statgrid">'+groups[title].map(([key,label,type])=>'<div class="stat"><span>'+(title==='Game mode scores'&&s[key]!=null?'<a href="'+leaderUrl(key,null,s)+'">'+safe(label)+' ↗</a>':safe(label))+'</span><strong>'+safe(formatStat(s,key,type))+'</strong></div>').join('')+'</div></section>').join('');
}
equipment(data.weapons.filter(x=>x.soldier_id===id),'weapons','weapon',s);equipment(data.vehicles.filter(x=>x.soldier_id===id),'vehicles','vehicle',s);$('message').hidden=true;$('content').hidden=false}
main().catch(e=>{$('name').textContent='Soldier unavailable';$('message').textContent=e.message||'Unable to load profile'});
