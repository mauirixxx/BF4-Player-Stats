<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soldier Dossier — BF4 Player Stats</title>
<style>
:root{color-scheme:dark;--bg:#090e14;--panel:#17212c;--inner:#101923;--line:#303c49;--muted:#9bb0c5;--orange:#f3a536}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 65% -10%,#293747,transparent 55%),var(--bg);color:#edf2f7;font:15px/1.5 Arial,sans-serif}a{color:var(--orange)}header{background:#101720;border-bottom:1px solid var(--line)}.wrap{max-width:1560px;margin:auto;padding:20px 28px}.brand{font-size:22px;font-weight:900;letter-spacing:1px}.brand b{color:var(--orange)}nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.eyebrow{color:var(--orange);letter-spacing:3px;font-size:11px;font-weight:bold}h1,h2{font-family:Impact,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:1px;font-weight:500}h1{font-size:clamp(36px,5vw,60px);margin:8px 0}h2{font-size:23px;margin:0 0 12px}.muted{color:var(--muted)}.hero{padding:28px 0;border-bottom:1px solid var(--line)}.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,1fr) minmax(260px,1fr);gap:16px;margin:24px 0;align-items:start}.panel{background:linear-gradient(155deg,#1c2732,#131b25);border:1px solid var(--line);padding:20px;min-width:0}.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:11px;background:var(--inner);border:1px solid #293644;min-width:0}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;color:var(--orange);font-size:19px;overflow-wrap:anywhere}.group{margin:18px 0 8px;color:#c5d3df;font-weight:bold;letter-spacing:1px;text-transform:uppercase;font-size:12px}.equipment{list-style:none;padding:0;margin:0}.equipment li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #293644}.equipment strong{white-space:nowrap;color:#e8eff8}.equipment span{overflow-wrap:anywhere}.message{padding:24px;border:1px solid var(--line);background:var(--panel)}@media(max-width:1100px){.layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.details{grid-column:1/-1}}@media(max-width:620px){.wrap{padding:16px}.layout{grid-template-columns:1fr}.details{grid-column:auto}}
</style></head><body><header><nav class="wrap"><div class="brand">BF4 <b>PLAYER STATS</b></div><a href="/index.html">← BACK TO LEADERBOARDS</a></nav></header><main class="wrap"><div class="hero"><div class="eyebrow">SOLDIER DOSSIER</div><h1 id="name">Loading soldier…</h1><div class="muted" id="identity"></div></div><div id="message" class="message">Loading collected statistics…</div><div class="layout" id="content" hidden><section class="panel details"><h2>Detailed statistics</h2><div id="stats"></div></section><section class="panel"><h2>Top 10 weapons</h2><ol class="equipment" id="weapons"></ol></section><section class="panel"><h2>Top 10 vehicles</h2><ol class="equipment" id="vehicles"></ol></section></div><footer class="muted">Community statistics · Not affiliated with EA or DICE · Data reflects the latest collected snapshot</footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id),fmt=n=>n==null?'—':Number(n).toLocaleString(),safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const labels={pc:'PC',ps4:'PlayStation',xboxone:'Xbox'};
const groups={
 'Overview':[['rank','Rank'],['kills','Kills'],['deaths','Deaths'],['wins','Wins'],['losses','Losses'],['total_score','Total score'],['time_played_seconds','Time played','duration'],['quit_percentage','Quit percentage','percent']],
 'Combat':[['headshots','Headshots'],['longest_headshot','Longest headshot'],['highest_kill_streak','Highest kill streak'],['kill_assists','Kill assists'],['avenger_kills','Avenger kills'],['savior_kills','Savior kills'],['suppression_assists','Suppression assists'],['nemesis_kills','Nemesis kills'],['highest_nemesis_streak','Highest nemesis streak'],['dogtags_taken','Dogtags taken'],['shots_fired','Shots fired'],['shots_hit','Shots hit'],['accuracy','Accuracy','accuracy'],['kd','K/D ratio','ratio']],
 'Teamwork & objectives':[['flags_captured','Flags captured'],['flags_defended','Flags defended'],['repairs','Repairs'],['revives','Revives'],['heals','Heals'],['resupplies','Resupplies'],['vehicles_destroyed','Vehicles destroyed'],['vehicle_damage','Vehicle damage']],
 'Class & squad scores':[['assault_score','Assault'],['engineer_score','Engineer'],['support_score','Support'],['recon_score','Recon'],['commander_score','Commander'],['squad_score','Squad'],['vehicle_score','Vehicle'],['combat_score','Combat'],['award_score','Awards'],['unlock_score','Unlocks']],
 'Game mode scores':[['conquest_score','Conquest'],['rush_score','Rush'],['team_deathmatch_score','Team deathmatch'],['domination_score','Domination'],['obliteration_score','Obliteration'],['defuse_score','Defuse'],['capture_the_flag_score','Capture the flag'],['air_superiority_score','Air superiority'],['carrier_assault_score','Carrier assault'],['chain_link_score','Chain link']]
};
function formatStat(s,key,type){if(type==='duration')return s[key]==null?'—':Math.floor(s[key]/3600).toLocaleString()+'h '+Math.floor(s[key]%3600/60)+'m';if(type==='percent')return s[key]==null?'—':Number(s[key]).toFixed(2)+'%';if(type==='ratio')return s.deaths==null||s.kills==null?'—':(s.kills/Math.max(1,s.deaths)).toFixed(2);if(type==='accuracy')return s.shots_fired==null||s.shots_hit==null?'—':(100*s.shots_hit/Math.max(1,s.shots_fired)).toFixed(2)+'%';return fmt(s[key])}
function equipment(rows,target){const list=rows.slice().sort((a,b)=>Number(b.kills)-Number(a.kills)).slice(0,10);$(target).innerHTML=list.length?list.map(x=>'<li><span>'+safe(x.name)+'</span><strong>'+fmt(x.kills)+'</strong></li>').join(''):'<li class="muted">Not collected yet</li>'}
async function main(){const id=Number(new URLSearchParams(location.search).get('id'));if(!Number.isSafeInteger(id)||id<=0)throw Error('Invalid soldier ID');const r=await fetch('/temp-stats-data.json',{cache:'no-store',signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('Statistics temporarily unavailable');const data=await r.json();const s=data.soldiers.find(x=>Number(x.soldier_id)===id);if(!s)throw Error('Soldier not found in collected snapshot');$('name').textContent=s.current_name;document.title=s.current_name+' — BF4 Player Stats';const identity=$('identity');identity.textContent=(labels[s.platform]||s.platform)+' · Persona '+s.persona_id+' · '+(s.battlelog_username||'Battlelog account pending')+' · Snapshot '+new Date(data.updated).toLocaleString();if(['pc','ps4','xboxone'].includes(s.platform)&&/^\d+$/.test(String(s.persona_id))){const a=document.createElement('a');a.href='https://battlelog.battlefield.com/bf4/soldier/'+encodeURIComponent(s.current_name)+'/stats/'+encodeURIComponent(s.persona_id)+'/'+s.platform+'/';a.target='_blank';a.rel='noopener noreferrer';a.textContent=' · View on Battlelog ↗';identity.appendChild(a)}
$('stats').innerHTML=Object.entries(groups).map(([title,fields])=>'<div class="group">'+safe(title)+'</div><div class="statgrid">'+fields.map(([key,label,type])=>'<div class="stat"><span>'+safe(label)+'</span><strong>'+safe(formatStat(s,key,type))+'</strong></div>').join('')+'</div>').join('');equipment(data.weapons.filter(x=>x.soldier_id===id),'weapons');equipment(data.vehicles.filter(x=>x.soldier_id===id),'vehicles');$('message').hidden=true;$('content').hidden=false}
main().catch(e=>{$('name').textContent='Soldier unavailable';$('message').textContent=e.message||'Unable to load profile'});
</script></body></html>
