name: Publish website release
on:
  push:
    tags:
      - 'website-v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package reviewed website source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --prefix=bf4ps-website/ HEAD site api docs deploy tests scripts README.md .gitignore > "dist/bf4ps-website-${GITHUB_REF_NAME}.zip"
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/SHA256SUMS.txt \
            --title "BF4PS Website ${GITHUB_REF_NAME}" \
            --notes-file docs/RELEASE-WEBSITE-2026-10-15.md \
            --latest=false
