:root{--orange:#f3a536}*{box-sizing:border-box}body{margin:0;background:#0b121b;color:#edf2f7;font-family:Arial,Helvetica,sans-serif}header.top{background:#101a26;border-bottom:1px solid #304255}.wrap{max-width:1440px;margin:0 auto;padding:28px}h1{font-size:clamp(42px,6vw,76px);letter-spacing:-2px;margin:12px 0 8px;font-weight:900}h2{margin:0 0 12px}p{color:#a9bdd0;line-height:1.6}.eyebrow{font-size:12px;color:var(--orange);font-weight:800;letter-spacing:3px}.panel{border:1px solid #32475a;background:linear-gradient(130deg,#1b2b3b,#101923);padding:28px;margin-top:26px}.panel a{color:#f3a536}.status{display:inline-block;padding:7px 11px;border:1px solid #64778b;color:#c5d2df;font-size:12px;font-weight:bold}.example{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px}.example strong{font-size:22px}.example a{border:1px solid #61778c;padding:11px 15px;text-decoration:none}.muted{color:#91a6b9;font-size:13px}@media(max-width:620px){.wrap{padding:20px}.panel{padding:18px}}
